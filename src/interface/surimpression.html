<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Le tchat posé sur le jeu. Une fenêtre sans cadre, translucide,
         toujours au-dessus, qu'on déplace par sa poignée. Elle ne montre que
         l'essentiel : les derniers messages, un champ pour répondre. Tout le
         reste vit dans la fenêtre principale — une surimpression qui veut
         tout faire finit par cacher le jeu qu'elle devait accompagner. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:;" />
    <title>Ludopia — tchat</title>
    <style>
      :root {
        --fond: rgba(8, 8, 19, 0.82);
        --trait: rgba(255, 255, 255, 0.14);
        --texte: #f5f4ff;
        --gris: #a5a3c8;
        --marque: #7c5cff;
        --vert: #2ee6a8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: transparent; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
        color: var(--texte);
        background: var(--fond);
        border: 1px solid var(--trait);
        border-radius: 12px;
        backdrop-filter: blur(14px);
      }

      /* La poignée : c'est elle qui déplace la fenêtre. Les boutons qu'elle
         porte doivent se déclarer non-déplaçables, sans quoi ils ne cliquent
         plus. */
      .poignee {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--trait);
        -webkit-app-region: drag;
        cursor: grab;
        user-select: none;
      }
      .poignee b { font-size: 12px; letter-spacing: 0.04em; }
      .poignee .etat {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--vert);
      }
      .poignee button {
        -webkit-app-region: no-drag;
        display: grid;
        place-items: center;
        width: 22px; height: 22px;
        font: inherit;
        color: var(--gris);
        background: transparent;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .poignee button:hover { color: var(--texte); background: rgba(255,255,255,0.1); }
      .poignee .pousse { margin-left: auto; }

      .fil {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px;
        overscroll-behavior: contain;
      }
      .fil::-webkit-scrollbar { width: 6px; }
      .fil::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }

      .msg { margin-bottom: 6px; overflow-wrap: anywhere; }
      .msg b { font-size: 12px; }
      .msg .ou { color: var(--gris); font-weight: 400; font-size: 11px; }
      .msg p { color: #e3e1f7; }

      .vide {
        padding: 14px 6px;
        color: var(--gris);
        font-size: 12px;
        text-align: center;
      }

      form {
        display: flex;
        gap: 6px;
        padding: 8px 10px 10px;
        border-top: 1px solid var(--trait);
      }
      .vers {
        max-width: 84px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        align-self: center;
        font-size: 11px;
        color: var(--gris);
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 6px 9px;
        font: inherit;
        color: var(--texte);
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--trait);
        border-radius: 8px;
      }
      input:focus { outline: none; border-color: var(--marque); }
      form button {
        padding: 0 10px;
        font: inherit;
        color: #0b0b14;
        background: var(--marque);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="poignee">
      <span class="etat"></span>
      <b>Ludopia</b>
      <button class="pousse" id="opacite" title="Plus ou moins transparent">◐</button>
      <button id="fermer" title="Masquer (F10)">✕</button>
    </div>
    <div class="fil" id="fil">
      <p class="vide" id="vide">Les messages de vos amis apparaîtront ici pendant que vous jouez.</p>
    </div>
    <form id="form">
      <span class="vers" id="vers" hidden></span>
      <input id="champ" type="text" maxlength="2000" placeholder="Répondre…" autocomplete="off" />
      <button type="submit">↑</button>
    </form>
    <script src="surimpression.js"></script>
  </body>
</html>
