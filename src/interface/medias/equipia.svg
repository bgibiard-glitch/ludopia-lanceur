<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration Equipia : paddock au coucher du soleil, fer à cheval et obstacle">
  <defs>
    <linearGradient id="eSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1230"/>
      <stop offset=".55" stop-color="#5a2333"/>
      <stop offset="1" stop-color="#0b0710"/>
    </linearGradient>
    <radialGradient id="eSun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset=".45" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eHill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a2c"/>
      <stop offset="1" stop-color="#1b0d18"/>
    </linearGradient>
    <linearGradient id="eHill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22101c"/>
      <stop offset="1" stop-color="#0d0710"/>
    </linearGradient>
    <linearGradient id="eShoe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd7a8"/>
      <stop offset=".5" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#c9550f"/>
    </linearGradient>
    <radialGradient id="eGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <style>
      .float{animation:bob 5.2s ease-in-out infinite alternate}
      @keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-18px) rotate(3deg)}}
      .dust{animation:drift 7s linear infinite}
      @keyframes drift{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}100%{opacity:0;transform:translate(60px,-70px)}}
      .sunp{animation:sp 6s ease-in-out infinite alternate;transform-origin:576px 196px}
      @keyframes sp{from{transform:scale(1)}to{transform:scale(1.08)}}
      .track{stroke-dasharray:520;stroke-dashoffset:520;animation:tr 4.5s cubic-bezier(.22,1,.36,1) infinite}
      @keyframes tr{0%{stroke-dashoffset:520}60%,100%{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){.float,.dust,.sunp,.track{animation:none;stroke-dashoffset:0}}
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#eSky)"/>

  <!-- soleil -->
  <g class="sunp">
    <circle cx="576" cy="196" r="180" fill="url(#eSun)" opacity=".55"/>
    <circle cx="576" cy="196" r="74" fill="#ffb877"/>
    <circle cx="576" cy="196" r="74" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <!-- collines -->
  <path d="M0 316 C120 276 200 300 300 292 C410 283 470 250 580 262 C680 273 740 300 800 288 L800 500 L0 500 Z" fill="url(#eHill1)"/>
  <path d="M0 372 C110 344 190 372 300 366 C420 359 500 330 620 342 C700 350 760 372 800 364 L800 500 L0 500 Z" fill="url(#eHill2)"/>

  <!-- piste : trace de galop -->
  <path class="track" d="M40 452 C180 418 260 440 380 424 C500 408 590 430 764 400"
        fill="none" stroke="#ff7a45" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-dasharray="520"/>

  <!-- clôture du paddock -->
  <g stroke="#c98a5e" stroke-opacity=".85" stroke-width="7" stroke-linecap="round">
    <path d="M60 470V386M180 464V384M300 458V382M420 452V380"/>
  </g>
  <g stroke="#a86f47" stroke-opacity=".75" stroke-width="6" stroke-linecap="round">
    <path d="M52 402 L428 396M52 434 L428 426"/>
  </g>

  <!-- obstacle de saut -->
  <g>
    <g stroke="#e8d3b8" stroke-width="8" stroke-linecap="round">
      <path d="M600 462V366M712 456V362"/>
    </g>
    <g stroke-linecap="round" stroke-width="9">
      <path d="M596 386 L716 382" stroke="#ff7a45"/>
      <path d="M596 416 L716 412" stroke="#f4f1ff"/>
      <path d="M596 446 L716 442" stroke="#ff7a45"/>
    </g>
  </g>

  <!-- fer à cheval -->
  <g class="float" style="transform-origin:220px 200px">
    <circle cx="220" cy="200" r="120" fill="url(#eGlow)"/>
    <path d="M220 108 C160 108 128 152 128 202 C128 240 146 268 168 284
             L188 262 C172 250 160 228 160 202 C160 170 182 142 220 142
             C258 142 280 170 280 202 C280 228 268 250 252 262
             L272 284 C294 268 312 240 312 202 C312 152 280 108 220 108 Z"
          fill="url(#eShoe)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <g fill="#5a2b0c" fill-opacity=".65">
      <circle cx="166" cy="180" r="6"/>
      <circle cx="176" cy="216" r="6"/>
      <circle cx="188" cy="248" r="6"/>
      <circle cx="274" cy="180" r="6"/>
      <circle cx="264" cy="216" r="6"/>
      <circle cx="252" cy="248" r="6"/>
    </g>
  </g>

  <!-- rosette de concours -->
  <g class="float" style="animation-delay:1.4s;transform-origin:470px 150px">
    <g fill="#ffd166">
      <circle cx="470" cy="150" r="30" fill="none" stroke="#ffd166" stroke-width="10" stroke-dasharray="12 9"/>
    </g>
    <circle cx="470" cy="150" r="18" fill="#ff7a45"/>
    <text x="470" y="157" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#3a1500">1</text>
    <path d="M458 176 L452 214 L470 202 L488 214 L482 176 Z" fill="#ffb877"/>
  </g>

  <!-- poussière -->
  <g fill="#ffd7a8">
    <circle class="dust" cx="120" cy="440" r="3"/>
    <circle class="dust" cx="330" cy="452" r="2.5" style="animation-delay:1.4s"/>
    <circle class="dust" cx="520" cy="466" r="3" style="animation-delay:2.6s"/>
    <circle class="dust" cx="680" cy="452" r="2.5" style="animation-delay:3.8s"/>
    <circle class="dust" cx="240" cy="468" r="2" style="animation-delay:5s"/>
  </g>
</svg>
