<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration Tradopia : courbe de marché et jeton Zellion">
  <defs>
    <linearGradient id="tSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171029"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <linearGradient id="tLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset=".6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb020" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f59b06"/>
    </linearGradient>
    <style>
      .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:drawIn 3.4s cubic-bezier(.22,1,.36,1) .3s forwards}
      @keyframes drawIn{to{stroke-dashoffset:0}}
      .bar{transform-origin:center bottom;animation:grow 2.6s cubic-bezier(.22,1,.36,1) infinite alternate}
      @keyframes grow{from{transform:scaleY(.72)}to{transform:scaleY(1.06)}}
      .float{animation:bob 5s ease-in-out infinite alternate}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-16px)}}
      .spark{animation:tw 2.4s ease-in-out infinite alternate}
      @keyframes tw{from{opacity:.25}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.bar,.float,.spark{animation:none}}
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#tSky)"/>

  <!-- grille de cotation -->
  <g stroke="#ffffff" stroke-opacity=".07">
    <path d="M0 100H800M0 180H800M0 260H800M0 340H800M0 420H800"/>
    <path d="M100 0V500M220 0V500M340 0V500M460 0V500M580 0V500M700 0V500"/>
  </g>

  <!-- chandeliers -->
  <g>
    <g class="bar" style="animation-delay:0s">
      <rect x="112" y="300" width="18" height="90" rx="5" fill="#2ee6a8" fill-opacity=".85"/>
      <path d="M121 282v20M121 388v20" stroke="#2ee6a8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="bar" style="animation-delay:.4s">
      <rect x="176" y="330" width="18" height="64" rx="5" fill="#ff5c9d" fill-opacity=".8"/>
      <path d="M185 314v18M185 392v18" stroke="#ff5c9d" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="bar" style="animation-delay:.8s">
      <rect x="240" y="268" width="18" height="120" rx="5" fill="#2ee6a8" fill-opacity=".85"/>
      <path d="M249 250v20M249 386v20" stroke="#2ee6a8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="bar" style="animation-delay:1.2s">
      <rect x="304" y="300" width="18" height="86" rx="5" fill="#ffb020" fill-opacity=".85"/>
      <path d="M313 282v20M313 384v20" stroke="#ffb020" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- surface sous la courbe -->
  <path d="M60 380 C150 350 200 300 268 316 C340 334 372 236 452 244 C528 252 560 176 640 160 C690 150 720 128 760 112 L760 440 L60 440 Z" fill="url(#tFill)"/>

  <!-- courbe -->
  <path class="draw" d="M60 380 C150 350 200 300 268 316 C340 334 372 236 452 244 C528 252 560 176 640 160 C690 150 720 128 760 112"
        fill="none" stroke="url(#tLine)" stroke-width="5" stroke-linecap="round"/>

  <!-- point de tête -->
  <g class="float">
    <circle cx="760" cy="112" r="34" fill="url(#tGlow)"/>
    <circle cx="760" cy="112" r="8" fill="#fff"/>
  </g>

  <!-- jeton Zellion -->
  <g class="float" style="animation-delay:1s">
    <circle cx="150" cy="140" r="74" fill="url(#tGlow)"/>
    <circle cx="150" cy="140" r="46" fill="url(#tCoin)"/>
    <circle cx="150" cy="140" r="46" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <circle cx="150" cy="140" r="36" fill="none" stroke="#7a4a00" stroke-opacity=".35" stroke-width="2"/>
    <text x="150" y="158" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#5c3600">Z</text>
  </g>

  <!-- étiquette de cours -->
  <g class="float" style="animation-delay:.5s">
    <rect x="556" y="64" width="150" height="52" rx="16" fill="#0d0b1c" fill-opacity=".85" stroke="#ffb020" stroke-opacity=".5"/>
    <text x="576" y="97" font-family="Outfit, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#ffd166">+18,4 %</text>
    <path d="M676 98l12-22 12 22z" fill="#2ee6a8"/>
  </g>

  <!-- poussière d'étoiles -->
  <g fill="#fff">
    <circle class="spark" cx="420" cy="86" r="2.5"/>
    <circle class="spark" cx="500" cy="420" r="2" style="animation-delay:.6s"/>
    <circle class="spark" cx="690" cy="330" r="2.5" style="animation-delay:1.1s"/>
    <circle class="spark" cx="70" cy="290" r="2" style="animation-delay:1.6s"/>
    <circle class="spark" cx="360" cy="150" r="2" style="animation-delay:2s"/>
  </g>
</svg>
