<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'"
    />
    <title>Ludopia</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Zone de saisie de la fenêtre : la barre native est masquée, il faut
         une bande déplaçable sinon la fenêtre ne bouge plus. -->
    <div class="barre" role="presentation">
      <div class="barre-marque">
        <img src="medias/logo.svg" alt="" width="24" height="24" />
        <span>Ludopia</span>
      </div>
      <div class="barre-outils">
        <button class="lien-langue" data-langue type="button">EN</button>
      </div>
    </div>

    <div class="cadre">
      <!-- Colonne des conversations : une pastille par ami, à la manière
           d'une messagerie. Elle n'apparaît qu'une fois connecté. -->
      <nav class="chats" id="chats" aria-label="Conversations" hidden></nav>
      <nav class="rail" aria-label="Bibliothèque">
        <button class="rail-accueil" id="accueil" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z" />
          </svg>
          <span data-t="accueil">Accueil</span>
        </button>
        <button class="rail-accueil rail-amis" id="amis" type="button" data-non-lus="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20" />
            <circle cx="10" cy="8" r="3.5" />
            <path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4" />
            <path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8" />
          </svg>
          <span class="rail-amis-libelle">Amis</span>
        </button>
        <button class="rail-accueil rail-amis" id="salonsBouton" type="button" data-non-lus="" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4Z" />
          </svg>
          <span class="rail-salons-libelle">Salons</span>
        </button>
        <p class="rail-titre" data-t="bibliotheque">Bibliothèque</p>
        <input class="rail-recherche" id="recherche" type="search" placeholder="Chercher un jeu…"
               autocomplete="off" spellcheck="false" />
        <ul class="rail-liste" id="rail"></ul>
        <div class="rail-pied">
          <button class="rail-lien" type="button" data-ouvrir="https://ludopia.fr" data-t="siteWeb">
            Site de Ludopia
          </button>
          <button class="rail-maj" id="maj" type="button" hidden></button>
          <p class="rail-version" id="version"></p>
        </div>
      </nav>

      <main class="scene" id="scene" aria-live="polite">
        <div class="vide" id="vide">
          <img src="medias/logo.svg" alt="" width="64" height="64" />
          <p data-t="chargement">Chargement de la bibliothèque…</p>
        </div>
      </main>
    </div>

    <script src="lanceur.js"></script>
  </body>
</html>
